services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: gsm2mqtt-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./configs/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 mosquitto_sub -t '$$SYS/#' -C 1 || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 3

  gsm2mqtt:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    container_name: gsm2mqtt-service
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - GSM2MQTT_MQTT_BROKER=mosquitto
      - GSM2MQTT_MQTT_PORT=1883
      - GSM2MQTT_API_ENABLED=true
      - GSM2MQTT_API_HOST=0.0.0.0
      - GSM2MQTT_API_PORT=8080
      - MODEM_DEVICE=${MODEM_DEVICE:-/dev/ttyUSB0}
    volumes:
      - ./configs/gsm2mqtt.yaml:/etc/gsm2mqtt/gsm2mqtt.yaml:ro
      - /dev:/dev
    privileged: true
