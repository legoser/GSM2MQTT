# Continuous integration: vet + tests + cross-compile check on every push/PR.
# Catches breakage before a release tag is created.
name: ci

on:
  push:
    branches:
      - main
    tags-ignore:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: release
    if: "!startsWith(github.event.head_commit.message, '[chore] (release)') && !startsWith(github.event.head_commit.message, 'chore(release)')"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Fast build check
        run: make build
      - name: Cross-compile check (main and PRs to main)
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: make build-all
