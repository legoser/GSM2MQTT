# ============================================================
# GSM2MQTT Configuration for OpenWrt
# ============================================================
# This configuration file documents all available options.
# Environment variables override any YAML setting.
# Pattern: GSM2MQTT_<SECTION>_<PARAM> (uppercase, underscore-separated)
# Example: GSM2MQTT_MQTT_BROKER=192.168.1.100

# Logging verbosity level: debug, info, warn, error
log_level: info

# ------------------------------------------------------------
# System Settings
# ------------------------------------------------------------
system:
  timezone: "auto"                     # Timezone: "auto" (reads host /etc/TZ or $TZ), fixed offset "+03:00", or "Europe/Moscow"

# ------------------------------------------------------------
# MQTT Broker Connection
# ------------------------------------------------------------
mqtt:
  broker: "127.0.0.1"                  # Broker address (localhost or LAN IP, e.g., 192.168.1.100)
  port: 1883                           # Broker port (usually 1883, or 8883 for TLS)
  username: ""                         # Broker username (leave empty if authentication is not required)
  password: ""                         # Broker password
  client_id: "gsm2mqtt-openwrt"        # Unique MQTT client identifier
  topic_prefix: "gsm2mqtt"             # Root MQTT topic prefix
  qos: 1                               # MQTT QoS level: 0 (at most once), 1 (at least once), 2 (exactly once)
  clean_session: true                  # Clean session flag (set false to persist subscriptions across reconnects)
  keep_alive: 60s                      # MQTT keep-alive ping interval (e.g., 30s, 60s)
  connect_timeout: 10s                 # Broker connection timeout (e.g., 10s)
  auto_reconnect: true                 # Automatically reconnect on connection loss
  max_reconnect_interval: 10m          # Maximum reconnection backoff interval
  discovery: true                      # Enable Home Assistant MQTT Auto Discovery (true / false)
  discovery_prefix: "homeassistant"    # Home Assistant Discovery prefix

  # TLS / SSL encrypted connection (optional)
  tls:
    enabled: false                     # Enable TLS connection
    ca_cert: ""                        # Path to CA certificate (e.g., /etc/ssl/certs/ca-certificates.crt)
    client_cert: ""                    # Path to client certificate (for mutual TLS / mTLS)
    client_key: ""                     # Path to client private key
    insecure_skip_verify: false        # Skip TLS certificate validation (NOT recommended in production)

# ------------------------------------------------------------
# GSM Modems Configuration
# ------------------------------------------------------------
# Configure one or more modems connected to your OpenWrt router.
# Required OpenWrt kernel modules for USB modems:
#   kmod-usb-serial, kmod-usb-serial-option (3G/4G modems), kmod-usb-acm (CDC ACM modems)
modems:
  - id: "modem1"                       # Unique identifier for the modem in topics and logs
    name: "Primary GSM Modem"          # Human-readable descriptive name
    port: "/dev/ttyUSB0"               # Serial port device path (/dev/ttyUSB0, /dev/ttyACM0, /dev/ttyS0)
    baud_rate: 115200                  # Serial baud rate: 9600, 19200, 38400, 57600, 115200
    type: "auto"                       # Modem type: auto | siemens | simcom | huawei | generic
    pin: ""                            # SIM PIN code (leave empty if PIN lock is disabled)
    data_bits: 8                       # Data bits: 7, 8
    stop_bits: 1                       # Stop bits: 1, 2
    parity: "none"                     # Parity checking: none, odd, even
    flow_control: "none"               # Flow control: none | hardware | software

  # Example 2: USB Huawei 3G/4G Modem (stick mode)
  # - id: "huawei_e3372"
  #   name: "Huawei E3372 4G"
  #   port: "/dev/ttyUSB1"
  #   baud_rate: 115200
  #   type: "huawei"
  #   pin: ""
  #   data_bits: 8
  #   stop_bits: 1
  #   parity: "none"
  #   flow_control: "none"

  # Example 3: SIM800L / SIM900 via UART or USB-UART converter
  # - id: "sim800"
  #   name: "SIM800L Module"
  #   port: "/dev/ttyUSB2"
  #   baud_rate: 9600
  #   type: "simcom"
  #   pin: ""
  #   data_bits: 8
  #   stop_bits: 1
  #   parity: "none"
  #   flow_control: "none"

  # Example 4: Router internal serial / COM port
  # - id: "serial_modem"
  #   name: "Serial Modem"
  #   port: "/dev/ttyS0"
  #   baud_rate: 9600
  #   type: "generic"
  #   pin: ""

# ------------------------------------------------------------
# SMS Settings (Encodings, Multipart, Delivery Reports)
# ------------------------------------------------------------
sms:
  # Outgoing SMS text encoding mode:
  # "auto"     — Auto-detect (Cyrillic/Unicode -> UCS-2, standard Latin -> GSM-7)
  # "translit" — Transliterate Cyrillic to Latin, then send as GSM-7 (160 chars vs 70 chars per SMS)
  # "ucs2"     — Force UCS-2 encoding (all characters supported, up to 70 chars per segment)
  # "gsm7"     — Force GSM-7 encoding (non-supported characters replaced with '?')
  encoding: "auto"

  # Handling of messages exceeding the single-SMS character limit:
  # "split"    — Automatically split into multipart SMS with standard UDH concatenation header
  # "truncate" — Truncate the text to fit within a single segment
  # "reject"   — Reject the message and return an error
  long_message: "split"
  max_segments: 4                      # Maximum number of concatenated SMS parts allowed

  # Include encoding metadata in MQTT delivery confirmations
  report_encoding: true

  # SMS Delivery Reports (SMS-STATUS-REPORT via TP-SRR)
  delivery_report:
    enabled: false                     # Enable delivery reports (many prepaid/M2M SIMs lack TP-SRR support)
    timeout: 5m                        # Maximum duration to await delivery report (e.g., 5m, 1h)
    publish_pending: false             # Publish intermediate pending status before cellular network delivery confirmation

# ------------------------------------------------------------
# Security and Filtering
# ------------------------------------------------------------
security:
  # Incoming SMS filtering policy:
  # "all"       — Forward all received SMS to MQTT (default)
  # "whitelist" — Forward only from phone numbers in the whitelist
  # "blacklist" — Forward all except phone numbers in the blacklist
  incoming_filter: "all"
  whitelist: []                        # e.g., ["+1234567890", "+1987654321"]
  blacklist: []                        # e.g., ["+1000000000"]

  # File path for persistent dynamic recipients list
  recipients_file: "/etc/gsm2mqtt/recipients.json"

  # Trigger a voice call alert if SMS delivery fails (optional)
  fallback_call: false

  # Rate limiting for outgoing SMS (anti-spam / loop protection)
  rate_limit:
    enabled: true
    max_sms_per_minute: 5              # Max outgoing SMS per minute
    max_sms_per_hour: 30               # Max outgoing SMS per hour
    max_sms_per_day: 100               # Max outgoing SMS per day
    max_sms_per_number_per_hour: 3     # Max outgoing SMS to a single number per hour
    cooldown_minutes: 10               # Pause duration after rate limit exhaustion (minutes)

  # Direct raw AT command execution via MQTT and REST API:
  # WARNING: Potentially dangerous, disabled by default.
  # When enabled, ONLY commands matching this strict allowlist will be executed.
  # Dialing, PIN entry, modem reset, and SMS transmission commands are intentionally excluded.
  allow_raw_at: false
  allowed_at_commands:
    - "ATI"                            # Device product identification
    - "AT+CSQ"                         # Signal quality query (RSSI and BER)
    - "AT+CREG"                        # Circuit-switched network registration status
    - "AT+CGREG"                       # GPRS network registration status
    - "AT+CEREG"                       # EPS / LTE network registration status
    - "AT+COPS"                        # Mobile network operator query/selection
    - "AT+CPIN?"                       # SIM lock / readiness status
    - "AT+CSCA"                        # SMS service center address
    - "AT+CGMI"                        # Manufacturer identification
    - "AT+CGMM"                        # Model identification
    - "AT+CGMR"                        # Firmware revision
    - "AT+CGSN"                        # Serial number / IMEI
    - "AT+CBC"                         # Battery / power supply status

# ------------------------------------------------------------
# Modem Status Monitoring
# ------------------------------------------------------------
status:
  interval: 30s                        # General modem health and registration check interval
  signal_interval: 60s                 # Periodic signal strength polling interval (RSSI/CSQ)

# ------------------------------------------------------------
# Tariff, Balance & Traffic Accounting
# ------------------------------------------------------------
tariff:
  enabled: false                       # Enable periodic balance queries and quota tracking
  operator_preset: "generic"           # Operator USSD parser preset: mts, megafon, beeline, tele2, generic
  balance_ussd: "*100#"                # USSD code for balance inquiry
  balance_regex: ""                    # Custom regex to extract balance amount (used when operator_preset is generic)
  auto_check_on_error: false           # Trigger automatic balance check upon SMS send failures
  check_interval: 168h                 # Balance check interval (e.g., 168h = weekly; 0s = disable scheduled checks)
  min_balance_alert: 50.0              # Low balance alert threshold triggering an MQTT warning
  sms_limit: 100                       # Monthly included SMS allowance
  call_minutes_limit: 0                # Monthly voice call minutes allowance (0 = unlimited)
  data_traffic_limit_mb: 0             # Monthly data allowance in megabytes (0 = unlimited)
  reset_day_of_month: 1                # Day of month to reset monthly quota counters
  storage_dir: "/etc/gsm2mqtt/tariff"  # Directory for persisting tariff accounting statistics

# ------------------------------------------------------------
# Embedded Web Dashboard & REST API
# ------------------------------------------------------------
api:
  enabled: false                       # Enable HTTP REST API and Web UI (disabled by default on routers to save RAM)
  host: "127.0.0.1"                    # Listen address (127.0.0.1 for local only, 0.0.0.0 for LAN access)
  port: 8080                           # HTTP port
  token: ""                            # Bearer secret token for HTTP API. If empty, API is unauthenticated!

# ------------------------------------------------------------
# Multi-Modem Pool (Load Balancing & Redundancy)
# ------------------------------------------------------------
pool:
  enabled: false                       # Enable pool routing (applicable when 2 or more modems are configured)
  strategy: "round-robin"              # Routing strategy: round-robin | failover | best-signal | operator-match
  default_modem: "modem1"              # Default fallback modem identifier
