services:
  gsm2mqtt:
    image: ghcr.io/legoser/gsm2mqtt:latest
    container_name: gsm2mqtt-service
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - GSM2MQTT_MQTT_BROKER=${GSM2MQTT_MQTT_BROKER:-127.0.0.1}
      - GSM2MQTT_MQTT_PORT=${GSM2MQTT_MQTT_PORT:-1883}
      - GSM2MQTT_API_ENABLED=true
      - GSM2MQTT_API_HOST=0.0.0.0
      - GSM2MQTT_API_PORT=8080
      # Make sure you provide GSM2MQTT_API_TOKEN in .env for API security!
    volumes:
      - ./configs/gsm2mqtt.yaml:/etc/gsm2mqtt/gsm2mqtt.yaml:ro
      - ./data:/app/data
    devices:
      - "${MODEM_DEVICE:-/dev/ttyUSB0}:${MODEM_DEVICE:-/dev/ttyUSB0}"
