# Release pipeline (GitHub mirror).
# The tag arrives here via Forgejo push-mirror, then this workflow rebuilds
# the same artifacts (CGO_ENABLED=0 + -trimpath => reproducible) and publishes
# a GitHub Release with identical names. No secrets required besides GITHUB_TOKEN.
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Validate tag format (vMAJOR.MINOR.PATCH)
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag OK: $TAG"
          else
            echo "tag must match vMAJOR.MINOR.PATCH, got: $TAG" >&2
            exit 1
          fi

      - name: Build all platforms (CGO_ENABLED=0, version via ldflags)
        run: make build-all

      - name: Smoke check version string
        run: ./bin/gsm2mqtt-linux-amd64 --version

      - name: Package versioned archives + checksums
        run: |
          mkdir -p dist
          for arch in amd64 arm64 riscv64; do
            staged="$(mktemp -d)"
            cp "bin/gsm2mqtt-linux-${arch}" "${staged}/gsm2mqtt"
            cp README.md LICENSE configs/gsm2mqtt.example.yaml "${staged}/"
            tar -czf "dist/gsm2mqtt-${TAG}-linux-${arch}.tar.gz" \
              -C "${staged}" gsm2mqtt README.md LICENSE gsm2mqtt.example.yaml
            rm -rf "${staged}"
          done

      - name: Build OpenWrt packages (OPKG and APK)
        run: |
          ./scripts/build_openwrt_packages.sh --version "${TAG}" --out-dir dist
          (cd dist && sha256sum ./*.tar.gz ./*.ipk ./*.apk > checksums.txt)
          ls -la dist && cat dist/checksums.txt

      - name: Generate release notes (CHANGELOG.md section or auto-generated from git history)
        run: |
          ver="${TAG#v}"
          if grep -q "^## \\[${ver}\\]" CHANGELOG.md 2>/dev/null; then
            {
              awk -v ver="$ver" '
                index($0, "## [" ver "]") == 1 {flag=1; next}
                flag && /^## / {exit}
                flag
              ' CHANGELOG.md | sed '/./,$!d'
              echo
              echo "## Installation"
              echo
              echo "### Standalone Binaries"
              echo '```bash'
              echo "sha256sum -c checksums.txt"
              echo "tar -xzf gsm2mqtt-${TAG}-linux-amd64.tar.gz"
              echo "./gsm2mqtt --version"
              echo '```'
              echo
              echo "### OpenWrt Packages"
              echo '```bash'
              echo "# OpenWrt <= 23.05 (OPKG):"
              echo "# Note: always specify leading './' or full path to local file"
              echo "# For Raspberry Pi 3 / Cortex-A53:"
              echo "opkg install ./gsm2mqtt_${ver}-1_aarch64_cortex-a53.ipk"
              echo "# For x86_64:"
              echo "opkg install ./gsm2mqtt_${ver}-1_x86_64.ipk"
              echo
              echo "# OpenWrt >= 25.12 (APK):"
              echo "apk add --allow-untrusted ./gsm2mqtt-${ver}-r1-aarch64.apk"
              echo
              echo "/etc/init.d/gsm2mqtt start"
              echo '```'
            } > release_notes.md
          else
            python3 scripts/generate_release_notes.py --tag "${TAG}" --output release_notes.md
          fi
          cat release_notes.md

      - name: Publish GitHub Release with assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            dist/*.tar.gz
            dist/*.ipk
            dist/*.apk
            dist/checksums.txt
