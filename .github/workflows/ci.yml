# Continuous integration (GitHub mirror): vet + tests + cross-compile check.
name: ci

on:
  push:
    branches:
      - main
    tags-ignore:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, '[chore] (release)') && !startsWith(github.event.head_commit.message, 'chore(release)')"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache Go build cache and apk tool
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/gsm2mqtt
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Fast build check
        run: make build
      - name: Cross-compile check (main and PRs to main)
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: make build-all
