# Continuous integration (GitHub mirror): vet + tests + cross-compile check.
name: ci

on:
  push:
    branches: ['**']
    tags-ignore: ['v*.*.*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Fast build check
        run: make build
      - name: Cross-compile check (main and PRs to main)
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: make build-all
